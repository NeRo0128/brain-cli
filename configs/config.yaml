# Configuración de Brain CLI
# Los placeholders ${VAR} se resuelven desde el entorno.
# Usa ${VAR:-default} para un valor por defecto.
# Entrecomilla si el valor puede contener caracteres especiales de YAML.

app:
  name: brain-cli
  version: "1.0.0"

database:
  path: ${BRAIN_DB_PATH:-data/brain.db}
  auto_migrate: true

logging:
  level: ${BRAIN_LOG_LEVEL:-debug}
  format: ${BRAIN_LOG_FORMAT:-pretty}
  output_path: /tmp/brain-cli.log
  max_size_mb: 100

ui:
  theme: ${BRAIN_THEME:-brain}
  brand_style: ascii
  icons: ${BRAIN_ICONS:-nerd-b}

scripts:
  custom_dir: scripts

github:
  client_id: "${GITHUB_CLIENT_ID:-Ov23lidLp21XFNT1V7kp}"
